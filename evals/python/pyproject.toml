[project]
name = "bakefix-evals"
version = "0.1.0"
description = "Dataset parsing and live-API LLM evaluation for BakeFix"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakefix_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long markdown table rows read better unwrapped.
"src/bakefix_evals/report.py" = ["E501"]
